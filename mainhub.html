<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악 도구 자료실</title>
<meta name="description" content="수업 시간에 바로 쓰는 음악과 수업 도구 자료 모음">
<meta name="theme-color" content="#7c4a22">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c4a22'/><text x='50' y='73' font-size='62' font-weight='bold' text-anchor='middle' fill='%23f0e4cf'>♪</text></svg>">
<style>
  :root{
    --bg:#f2ebdf;
    --card:#fffaf2;
    --line:#e0d4bf;
    --ink:#2b2218;
    --muted:#8a7c66;
    --accent:#7c4a22;
    --accent-soft:#f5e9d7;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 60px}

  /* 헤더 */
  header{margin-bottom:28px}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:700;text-transform:uppercase}
  h1{font-size:clamp(26px,5vw,38px);margin:6px 0 8px;letter-spacing:-.03em;line-height:1.15}
  .lede{margin:0;color:var(--muted);font-size:15px;max-width:56ch}

  /* 필터 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .filters button{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:999px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:all .15s;
  }
  .filters button:hover{border-color:var(--accent);color:var(--accent)}
  .filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* 카드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .card{
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;text-decoration:none;color:inherit;
    transition:transform .16s cubic-bezier(.34,1.2,.6,1),box-shadow .16s,border-color .16s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(120,90,40,.13);border-color:var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card .icon{font-size:26px;line-height:1;margin-bottom:12px}
  .card h2{font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
  .card p{margin:0;font-size:13.5px;color:var(--muted);flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:8px}
  .tag{
    display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em;
  }
  .arrow{color:var(--accent);font-size:15px;font-weight:700;opacity:0;transform:translateX(-4px);transition:all .16s}
  .card:hover .arrow{opacity:1;transform:translateX(0)}

  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;grid-column:1/-1}

  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
  footer p{margin:0 0 4px}

  @media(max-width:600px){
    .wrap{padding:28px 16px 48px}
    .grid{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){
    .card,.arrow{transition:none}
    .card:hover{transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">수업 도구 자료실</div>
    <h1>음악 수업 도구 자료</h1>
    <p class="lede">수업 시간에 바로 열어 쓰는 자료 모음입니다. 카드를 누르면 해당 자료가 열립니다.</p>
  </header>

  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>

  <footer>
    <p>스마트폰·태블릿에서도 그대로 열립니다.</p>
    <p>자료 관련 문의는 음악실로 알려 주세요.</p>
  </footer>
</div>

<script>
/* ==========================================================
   자료 목록 — 여기만 수정하면 됩니다.
   title : 자료 이름
   desc  : 한 줄 설명
   url   : 링크 (같은 저장소 안이면 'uke/', 'song/' 처럼 폴더명)
   tag   : 분류 (필터 버튼이 자동으로 만들어집니다)
   icon  : 카드에 표시할 이모지
   ========================================================== */
const ITEMS = [
  {
    title: "교가",
    desc:  "우리 학교 교가 악보와 음원입니다. 입학식·행사 연습에 사용합니다.",
    url:   "musictool/schoolsong_hh.html",
    tag:   "감상·가창",
    icon:  "🎵"
  },
  {
    title: "멀티모드 튜너",
    desc:  "우쿨렐레·기타·베이스·바이올린 조율 연습. 줄감개를 직접 돌려보며 조율 원리를 익힙니다.",
    url:   "musictool/tuner.html",
    tag:   "기악",
    icon:  "🎸"
  },
  {
    title: "음색 원리",
    desc:  "소리나는 웹 악기",
    url:   "musictool/tones.html",
    tag:   "기악·감상",
    icon:  "🎹"
  },
  /* ── 자료를 추가할 때는 아래 형식을 복사해서 쓰세요 ──
  {
    title: "자료 이름",
    desc:  "한 줄 설명",
    url:   "폴더명/",
    tag:   "분류",
    icon:  "🎹"
  },
  */
];

/* ===== 이하 수정 불필요 ===== */
const grid = document.getElementById('grid');
const filters = document.getElementById('filters');
let active = '전체';

function buildFilters(){
  const tags = ['전체', ...new Set(ITEMS.map(i => i.tag).filter(Boolean))];
  filters.innerHTML = '';
  tags.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t;
    b.className = (t === active) ? 'on' : '';
    b.addEventListener('click', () => { active = t; buildFilters(); buildCards(); });
    filters.appendChild(b);
  });
  // 자료가 하나뿐이면 필터를 숨김
  filters.style.display = (tags.length <= 2) ? 'none' : 'flex';
}

function buildCards(){
  const list = ITEMS.filter(i => active === '전체' || i.tag === active);
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty">아직 등록된 자료가 없습니다.</div>';
    return;
  }
  list.forEach(item => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = item.url;
    a.innerHTML = `
      <div class="icon">${item.icon || '📄'}</div>
      <h2></h2>
      <p></p>
      <div class="foot">
        <span class="tag"></span>
        <span class="arrow">열기 →</span>
      </div>`;
    a.querySelector('h2').textContent = item.title;
    a.querySelector('p').textContent = item.desc || '';
    const tagEl = a.querySelector('.tag');
    if(item.tag){ tagEl.textContent = item.tag; } else { tagEl.remove(); }
    grid.appendChild(a);
  });
}

buildFilters();
buildCards();
</script>
</body>
</html>
