<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1학년 음악 수업 띵커벨 링크</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, background-color 0.2s;
        }
        /* 각 반별 버튼 색상 다르게 지정 */
        .btn-6 { background-color: #ff8e6b; } /* 6반: 빨강계열 */
        .btn-7 { background-color: #78c6b5; } /* 7반: 민트계열 */
        .btn-8 { background-color: #4592d1; } /* 8반: 파랑계열 */
        .btn-9 { background-color: #1b9907; } /* 9반: 연두계열 */
        .btn-10 { background-color: #9B59B6; } /* 10반: 보라계열 */
        
        /* 버튼에 마우스를 올렸을 때 애니메이션 효과 */
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
    </style>
</head>
<body>

    <h1>🎶 1학년 음악감상 띵커벨</h1>
    
    <div class="button-container">
        <a href="여기에_6반_링크_입력" target="_blank" class="btn btn-6">1학년 6반</a>
        <a href="여기에_7반_링크_입력" target="_blank" class="btn btn-7">1학년 7반</a>
        <a href="https://b.tkbell.co.kr/tkboard/woi/1161226/Oe162DMl6l.do?pageSeq=2544285" target="_blank" class="btn btn-8">1학년 8반</a>
        <a href="여기에_9반_링크_입력" target="_blank" class="btn btn-9">1학년 9반</a>
        <a href="여기에_10반_링크_입력" target="_blank" class="btn btn-10">1학년 10반</a>
    </div>

</body>
</html>
