<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우쿨렐레 악보 검색기</title>
    <style>
        /* 기본 페이지 배경 및 정렬 설정 */
        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        
        /* 검색창 컨테이너 디자인 */
        .search-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        
        .search-container h2 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #333;
            font-size: 24px;
        }

        .search-container p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        
        /* 검색 폼(입력창+버튼) 레이아웃 */
        .search-form {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            border-color: #ff9800; /* 우쿨렐레 느낌의 따뜻한 오렌지색 포인터 */
        }
        
        .search-button {
            padding: 14px 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        
        .search-button:hover {
            background-color: #e68a00;
        }
        
        /* 하단 링크 디자인 */
        .site-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .site-link:hover {
            color: #333;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="search-container">
    <h2>🎵 우쿨렐레 악보 검색</h2>
    <p>하루 한 장 우쿨렐레(11ukul.com)에서<br>원하는 곡의 코드 악보를 검색해보세요!</p>
    
    <form class="search-form" action="https://11ukul.com/" method="get" target="_blank">
        <input type="text" name="s" class="search-input" placeholder="곡명 또는 가수 입력..." required>
        <button type="submit" class="search-button">검색</button>
    </form>

    <a href="https://11ukul.com/" class="site-link" target="_blank">11ukul.com 메인으로 가기</a>
</div>

</body>
</html>
